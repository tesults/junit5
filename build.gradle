plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'com.vanniktech.maven.publish.base' version '0.37.0'
}

group 'com.tesults.junit5'
version '1.3.0'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.tesults:tesults:1.0.3'
    implementation 'org.json:json:20171018'
    implementation 'org.junit.jupiter:junit-jupiter-api:5.4.2'
    implementation 'org.junit.jupiter:junit-jupiter-engine:5.4.2'
    implementation 'org.junit.platform:junit-platform-launcher:1.4.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.4.2'
}

processResources {
    filesMatching('com/tesults/junit5/version.properties') {
        expand(projectVersion: project.version)
    }
}

test {
    useJUnitPlatform()
    exclude '**/*$*'
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'tesults-junit5'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'tesults-junit5'
                description = 'Tesults JUnit5 Listener'
                url = 'https://www.tesults.com'
                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                        distribution = "repo"
                    }
                }
                developers {
                    developer {
                        id = "ajeetd"
                        name = "Ajeet Dhaliwal"
                        email = "help@tesults.com"
                    }
                }

                scm {
                    url = "https://github.com/tesults/junit5.git"
                }
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('mavenlocal') }) {
        signAllPublications()
    }
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}
