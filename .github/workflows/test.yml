name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17', '21']

    steps:
      - uses: actions/checkout@v5
      - name: Set up test Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Save test Java location
        run: echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up build Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build and test on Java ${{ matrix.java }}
        run: ./gradlew clean test build -PtestJavaVersion=${{ matrix.java }} -Dorg.gradle.java.installations.paths="$TEST_JAVA_HOME,$JAVA_HOME"
